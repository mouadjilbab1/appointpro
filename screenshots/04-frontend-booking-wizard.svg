  <rect x="150" y="310" width="335" height="110" rx="10" fill="#f5f3ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="170" y="340" font-size="15" font-weight="700" fill="#0f172a">Master Executive Haircut</text>
  <text x="170" y="365" font-size="12" fill="#64748b">Precision cut, shampoo, styling &amp; scalp massage.</text>
  <text x="170" y="398" font-size="12" font-weight="600" fill="#64748b">⏱ 45 mins</text>
  <text x="410" y="398" font-size="16" font-weight="700" fill="#4f46e5">$45.00</text>
  
  <!-- Service Card 2 -->
  <rect x="505" y="310" width="335" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="525" y="340" font-size="15" font-weight="700" fill="#0f172a">Beard Trim &amp; Hot Towel</text>
  <text x="525" y="365" font-size="12" fill="#64748b">Traditional hot towel shave and beard grooming.</text>
  <text x="525" y="398" font-size="12" font-weight="600" fill="#64748b">⏱ 30 mins</text>
  <text x="765" y="398" font-size="16" font-weight="700" fill="#0f172a">$25.00</text>
  
  <!-- Category 2 Title -->
  <text x="150" y="455" font-size="14" font-weight="700" fill="#10b981">WELLNESS &amp; SPA</text>
  
  <!-- Service Card 3 -->
  <rect x="150" y="470" width="335" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="170" y="500" font-size="15" font-weight="700" fill="#0f172a">Deep Tissue Massage</text>
  <text x="170" y="525" font-size="12" fill="#64748b">60-minute therapeutic massage with organic oils.</text>
  <text x="170" y="558" font-size="12" font-weight="600" fill="#64748b">⏱ 60 mins</text>
  <text x="410" y="558" font-size="16" font-weight="700" fill="#0f172a">$85.00</text>
  
  <!-- Service Card 4 -->
  <rect x="505" y="470" width="335" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="525" y="500" font-size="15" font-weight="700" fill="#0f172a">Aromatherapy Relaxation</text>
  <text x="525" y="525" font-size="12" fill="#64748b">Gentle relaxation therapy with custom fragrances.</text>
  <text x="525" y="558" font-size="12" font-weight="600" fill="#64748b">⏱ 75 mins</text>
  <text x="765" y="558" font-size="16" font-weight="700" fill="#0f172a">$95.00</text>
  
  <!-- Wizard Footer Controls -->
  <line x1="150" y1="620" x2="840" y2="620" stroke="#f1f5f9"/>
  <rect x="715" y="640" width="125" height="42" rx="8" fill="#4f46e5"/>
  <text x="735" y="666" font-size="14" font-weight="600" fill="#ffffff">Continue →</text>
