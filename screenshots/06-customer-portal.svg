    <!-- Row 3 (Past Completed) -->
    <g transform="translate(0, 218)">
      <text x="25" y="34" font-size="13" font-weight="800" fill="#64748b">#AP-8412</text>
      
      <text x="160" y="26" font-size="13" font-weight="700" fill="#0f172a">Dental Cleaning &amp; Polish (45m)</text>
      <text x="160" y="44" font-size="11" fill="#64748b">Downtown Dental Suite</text>

      <text x="440" y="26" font-size="13" font-weight="600" fill="#0f172a">Dr. Emily Stone</text>
      <text x="440" y="44" font-size="11" fill="#64748b">Lead Dentist</text>

      <text x="600" y="26" font-size="13" font-weight="700" fill="#0f172a">Oct 20, 11:00 AM</text>
      <text x="600" y="44" font-size="11" fill="#64748b">Completed</text>

      <rect x="780" y="18" width="95" height="24" rx="12" fill="#f1f5f9"/>
      <text x="796" y="34" font-size="11" font-weight="700" fill="#64748b">COMPLETED</text>

      <rect x="910" y="16" width="145" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
