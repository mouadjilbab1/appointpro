<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#f1f5f9; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Background Canvas -->
  <rect x="0" y="0" width="1200" height="800" fill="#f1f5f9"/>

  <!-- Browser Window Frame -->
  <rect x="30" y="25" width="1140" height="750" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 15px 35px rgba(0,0,0,0.06))"/>
  
  <!-- Browser Window Header -->
  <path d="M 30 41 A 16 16 0 0 1 46 25 L 1154 25 A 16 16 0 0 1 1170 41 L 1170 75 L 30 75 Z" fill="#f8fafc"/>
  <line x1="30" y1="75" x2="1170" y2="75" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="60" cy="50" r="6" fill="#ef4444"/>
  <circle cx="80" cy="50" r="6" fill="#f59e0b"/>
  <circle cx="100" cy="50" r="6" fill="#10b981"/>
  
  <!-- URL Address Bar -->
  <rect x="250" y="37" width="700" height="26" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="490" y="54" font-size="12" fill="#64748b">🔒 https://yourwebsite.com/my-account/appointments</text>

  <!-- Portal Header with Profile Card -->
  <g transform="translate(60, 105)">
    <!-- Avatar Circle -->
    <circle cx="35" cy="35" r="35" fill="#e0e7ff"/>
    <text x="21" y="44" font-size="24" font-weight="700" fill="#4f46e5">ER</text>

    <!-- Client Info -->
    <text x="85" y="30" font-size="20" font-weight="800" fill="#0f172a">Elena Rostova</text>
    <text x="85" y="50" font-size="13" fill="#64748b">Verified Customer • Member since March 2024 • elena.rostova@example.com</text>

    <!-- Top Right Action -->
    <rect x="910" y="15" width="170" height="40" rx="8" fill="#4f46e5"/>
    <text x="932" y="40" font-size="13" font-weight="700" fill="#ffffff">+ Book New Session</text>
  </g>

  <!-- Quick Stats Cards Row -->
  <g transform="translate(60, 195)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="345" height="85" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="45" cy="42" r="22" fill="#eef2ff"/>
    <text x="37" y="48" font-size="18">📅</text>
    <text x="85" y="35" font-size="11" font-weight="700" fill="#64748b">UPCOMING BOOKINGS</text>
    <text x="85" y="62" font-size="22" font-weight="800" fill="#4f46e5">2 Appointments</text>

    <!-- Stat 2 -->
    <rect x="365" y="0" width="345" height="85" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="410" cy="42" r="22" fill="#f0fdf4"/>
    <text x="402" y="48" font-size="18">✓</text>
    <text x="450" y="35" font-size="11" font-weight="700" fill="#64748b">COMPLETED SESSIONS</text>
    <text x="450" y="62" font-size="22" font-weight="800" fill="#10b981">8 Appointments</text>

    <!-- Stat 3 -->
    <rect x="735" y="0" width="345" height="85" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="780" cy="42" r="22" fill="#fef3c7"/>
    <text x="772" y="48" font-size="18">💳</text>
    <text x="820" y="35" font-size="11" font-weight="700" fill="#64748b">TOTAL INVESTED</text>
    <text x="820" y="62" font-size="22" font-weight="800" fill="#0f172a">$840.00</text>
