    <text x="600" y="74" font-size="11" font-weight="700" fill="#475569">DATE &amp; TIME</text>
    <text x="780" y="74" font-size="11" font-weight="700" fill="#475569">STATUS</text>
    <text x="930" y="74" font-size="11" font-weight="700" fill="#475569">ACTIONS</text>

    <!-- Row 1 (Upcoming Confirmed) -->
    <g transform="translate(0, 88)">
      <text x="25" y="34" font-size="13" font-weight="800" fill="#4f46e5">#AP-9041</text>
      
      <text x="160" y="26" font-size="13" font-weight="700" fill="#0f172a">Executive Health Checkup (60m)</text>
      <text x="160" y="44" font-size="11" fill="#64748b">Downtown Medical Suite</text>

      <text x="440" y="26" font-size="13" font-weight="600" fill="#0f172a">Dr. Alex Rivera</text>
      <text x="440" y="44" font-size="11" fill="#64748b">Chief Consultant</text>

      <text x="600" y="26" font-size="13" font-weight="700" fill="#0f172a">Tomorrow, 10:30 AM</text>
