      <text x="25" y="34" font-size="13" font-weight="800" fill="#4f46e5">#AP-8840</text>
      
      <text x="160" y="26" font-size="13" font-weight="700" fill="#0f172a">Aromatherapy &amp; Spa Therapy (90m)</text>
      <text x="160" y="44" font-size="11" fill="#64748b">West End Luxury Wellness</text>

      <text x="440" y="26" font-size="13" font-weight="600" fill="#0f172a">Sarah Jenkins</text>
      <text x="440" y="44" font-size="11" fill="#64748b">Senior Therapist</text>

      <text x="600" y="26" font-size="13" font-weight="700" fill="#0f172a">Nov 14, 02:00 PM</text>
